<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRG Warehouse Stock</title>
<meta name="description" content="SRG warehouse stock: photos, bin locations, and stock booked in and out to venues.">
<meta name="theme-color" content="#141311">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Warehouse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: black SRG masthead with cream wordmark and an orange rule, a summary strip, then a photo grid of stock;
   tapping an item opens a side sheet with its photos, bin location, book in/out and history.
   Palette and type follow the SRG Brand Toolkit (Sept 2025): Cream, Blue, Wood Brown, Black, Orange; serif headlines, Karla body. */
:root {
  --bg: #fbf6e6;          /* SRG Cream */
  --surface: #fffdf6;
  --sunken: #f1ead3;
  --ink: #141311;         /* SRG Black */
  --muted: #6b6457;
  --line: #e2d9bf;
  --blue: #a5beba;        /* SRG Blue */
  --blue-ink: #3e6460;
  --wood: #b09262;        /* SRG Wood Brown */
  --wood-ink: #7a5f33;
  --orange: #e25729;      /* SRG Orange */
  --orange-ink: #b63f17;
  --on-orange: #ffffff;
  --mast: #141311;
  --mast-ink: #fbf6e6;
  --mast-sub: #a5beba;
  --mast-field: #26241f;
  --in: #3e6460; --in-bg: #e1ebe8;
  --out: #b63f17; --out-bg: #fbe3d8;
  --warn: #7a5f33; --warn-bg: #f1e6cf;
  --scrim: rgba(20, 19, 17, .5);
  --shadow: 0 1px 2px rgba(20, 19, 17, .06), 0 10px 28px rgba(20, 19, 17, .08);
  --f-display: "Source Serif 4", "Generis Serif", Georgia, "Times New Roman", serif;
  --f-body: "Karla", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --surface: #1e1c18; --sunken: #29261f; --ink: #fbf6e6; --muted: #b5ac98; --line: #36322a;
    --blue: #a5beba; --blue-ink: #a5beba; --wood: #b09262; --wood-ink: #d1b588; --orange: #e25729; --orange-ink: #f08a63; --on-orange: #ffffff;
    --mast: #0c0b0a; --mast-ink: #fbf6e6; --mast-sub: #a5beba; --mast-field: #1e1c18;
    --in: #a5beba; --in-bg: #233532; --out: #f08a63; --out-bg: #3d2117; --warn: #d1b588; --warn-bg: #352b1b;
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --surface: #1e1c18; --sunken: #29261f; --ink: #fbf6e6; --muted: #b5ac98; --line: #36322a;
  --blue: #a5beba; --blue-ink: #a5beba; --wood: #b09262; --wood-ink: #d1b588; --orange: #e25729; --orange-ink: #f08a63; --on-orange: #ffffff;
  --mast: #0c0b0a; --mast-ink: #fbf6e6; --mast-sub: #a5beba; --mast-field: #1e1c18;
  --in: #a5beba; --in-bg: #233532; --out: #f08a63; --out-bg: #3d2117; --warn: #d1b588; --warn-bg: #352b1b;
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--mast); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.mono { font-family: var(--f-body); font-variant-numeric: tabular-nums; letter-spacing: .04em; font-size: .9em; }
.num { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }
.eyebrow, .stat span, .fact > span, .section > h3, .day { font-family: var(--f-body); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }

/* Masthead */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--mast); color: var(--mast-ink); border-bottom: 3px solid var(--orange); }
.top-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 14px; margin-right: auto; min-width: 0; }
.brand .logo { height: 30px; width: auto; color: var(--mast-ink); flex: none; }
.brand-text { display: grid; gap: 1px; padding-left: 14px; border-left: 1px solid rgba(251, 246, 230, .25); }
.brand h1 { font: 400 22px/1.1 var(--f-display); margin: 0; letter-spacing: .01em; }
.brand small { color: var(--mast-sub); font-size: 12px; letter-spacing: .04em; }
.search { flex: 1 1 260px; max-width: 440px; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid rgba(251, 246, 230, .18); border-radius: var(--r); background: var(--mast-field); color: var(--mast-ink); }
.search input::placeholder { color: rgba(251, 246, 230, .55); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: none; stroke: var(--mast-sub); stroke-width: 2; }
.tabs { display: flex; gap: 6px; }
.tab { border: 0; background: none; padding: 8px 2px 10px; margin-right: 18px; font: 700 12.5px/1 var(--f-body); text-transform: uppercase; letter-spacing: .14em; color: rgba(251, 246, 230, .6); cursor: pointer; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--mast-ink); border-bottom-color: var(--blue); }
.tab:hover { color: var(--mast-ink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--orange); color: var(--on-orange); border-color: var(--orange); letter-spacing: .02em; }
.btn.primary:hover { filter: brightness(1.06); border-color: var(--orange); }
.btn.danger { color: var(--out); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

/* Summary */
main { padding-block: 22px 48px; display: grid; gap: 18px; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; border: 0; text-align: left; display: grid; gap: 4px; }
button.stat { cursor: pointer; }
button.stat:hover { background: var(--sunken); }
.stat b { font: 400 34px/1 var(--f-display); font-variant-numeric: tabular-nums lining-nums; }
.stat.alert b { color: var(--wood-ink); }
.stat.crit b { color: var(--orange-ink); }
@media (max-width: 640px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters select { padding: 7px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.filters .spacer { flex: 1; }
.count { color: var(--muted); font-size: 14px; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; min-width: 0; }
.card:hover { box-shadow: var(--shadow); border-color: var(--wood); }
.thumb { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; background: var(--sunken); display: grid; place-items: center; overflow: hidden; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { width: 38%; height: 38%; fill: none; stroke: var(--wood); stroke-width: 1.2; opacity: .8; }
.thumb .count-badge { position: absolute; right: 6px; bottom: 6px; background: var(--scrim); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 3px; }
.card-body { padding: 12px 14px 14px; display: grid; gap: 8px; min-width: 0; }
.card-name { font: 400 18px/1.2 var(--f-display); overflow-wrap: anywhere; }
.card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; min-width: 0; }
.card-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.qty { font: 400 28px/1 var(--f-display); font-variant-numeric: tabular-nums lining-nums; }
.qty small { font: 400 13px var(--f-body); color: var(--muted); margin-left: 4px; }
.bin { display: inline-block; font: 700 12px/1.5 var(--f-body); font-variant-numeric: tabular-nums; letter-spacing: .08em; background: var(--blue); color: #141311; padding: 1px 7px; border-radius: 2px; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.low { background: var(--warn-bg); color: var(--warn); }
.pill.none { background: var(--out-bg); color: var(--out); }
.pill.ok { background: var(--in-bg); color: var(--in); }

/* Empty / notices */
.empty { background: var(--surface); border: 1px dashed var(--wood); border-radius: var(--r); padding: 40px 20px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font: 400 28px/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0; max-width: 52ch; }
.notice { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: var(--r); font-size: 14px; }

/* Activity */
.log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.log-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: start; }
.day + .log-row { border-top: 0; }
.log-when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.log-what { min-width: 0; }
.log-what .t { font-weight: 700; overflow-wrap: anywhere; }
.log-what .d { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.log-delta { text-align: right; font: 400 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums lining-nums; }
.log-delta small { display: block; font: 400 12px var(--f-body); color: var(--muted); }
.d-in { color: var(--in); } .d-out { color: var(--out); } .d-count { color: var(--wood-ink); }
.day { padding: 8px 14px; background: var(--sunken); border-top: 1px solid var(--line); }
.log > .day:first-child, .hist > .day:first-child { border-top: 0; }
button.linkish { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; font-weight: 700; text-decoration: underline; text-decoration-color: var(--wood); text-underline-offset: 3px; }
@media (max-width: 520px) { .log-row { grid-template-columns: minmax(0, 1fr) auto; } .log-when { grid-column: 1 / -1; } }

/* Sheet */
.overlay { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; justify-content: flex-end; }
.sheet { background: var(--bg); width: min(600px, 100%); height: 100%; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: var(--shadow); }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--mast); color: var(--mast-ink); border-bottom: 3px solid var(--orange); display: flex; align-items: center; gap: 10px; padding-block: 14px; }
.sheet-head h2 { font: 400 24px/1.15 var(--f-display); margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; text-wrap: balance; }
.sheet-head .btn.ghost { color: var(--mast-ink); }
.sheet-body { padding-block: 18px 32px; display: grid; gap: 20px; }
.section { display: grid; gap: 10px; }
.section > h3 { margin: 0; }
.photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.photo { flex: 0 0 auto; width: 150px; aspect-ratio: 1; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--sunken); position: relative; scroll-snap-align: start; border: 0; padding: 0; cursor: zoom-in; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--scrim); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 16px; line-height: 1; }
.add-photo { flex: 0 0 auto; width: 150px; aspect-ratio: 1; max-width: 100%; border: 1px dashed var(--wood); border-radius: var(--r); display: grid; place-items: center; align-content: center; gap: 6px; color: var(--wood-ink); cursor: pointer; background: var(--surface); font-size: 14px; font-weight: 700; text-align: center; padding: 8px; }
.add-photo:hover { border-style: solid; }
.add-photo svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.fact { background: var(--surface); padding: 12px 14px; min-width: 0; }
.fact > span { display: block; margin-bottom: 2px; }
.fact b { font-weight: 700; overflow-wrap: anywhere; }
.fact.big b { font: 400 40px/1.05 var(--f-display); font-variant-numeric: tabular-nums lining-nums; }
.notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.move { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 11px 6px; cursor: pointer; font: 700 12.5px var(--f-body); text-transform: uppercase; letter-spacing: .12em; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"][data-t="in"] { background: var(--blue); color: #141311; }
.seg button[aria-pressed="true"][data-t="out"] { background: var(--orange); color: var(--on-orange); }
.seg button[aria-pressed="true"][data-t="count"] { background: var(--wood); color: #141311; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
label.f input, label.f select, label.f textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink); font-weight: 400; font-size: 16px; }
label.f textarea { min-height: 70px; resize: vertical; }
.stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; }
.stepper button { border: 1px solid var(--line); background: var(--sunken); font-size: 22px; cursor: pointer; }
.stepper button:first-child { border-radius: var(--r) 0 0 var(--r); }
.stepper button:last-child { border-radius: 0 var(--r) var(--r) 0; }
.stepper input { border-radius: 0 !important; text-align: center; font: 400 26px var(--f-display) !important; font-variant-numeric: lining-nums; border-left: 0 !important; border-right: 0 !important; }
.preview { font-size: 14px; color: var(--muted); }
.preview b { color: var(--ink); }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.foot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.confirm { background: var(--out-bg); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; color: var(--ink); }
.req { color: var(--orange-ink); }
.status { font-size: 13px; color: var(--muted); }

/* Lightbox + toast */
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(12,11,10,.92); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 14px; border-left: 3px solid var(--blue); }
.toast.err { border-left-color: var(--orange); }
@media (prefers-reduced-motion: no-preference) {
  .sheet.enter { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
}

html, body { margin: 0; }
img { max-width: 100%; }
code { font-size: .9em; background: var(--sunken); padding: 1px 5px; border-radius: 3px; }
.mast-btn { color: var(--mast-ink); border-color: rgba(251, 246, 230, .25); padding: 9px 12px; }
.mast-btn:hover { border-color: var(--mast-ink); }
.photo .zoom { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
.photo .zoom:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }

/* Sign-in */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px)); background: var(--mast); }
.auth-card { width: min(400px, 100%); background: var(--bg); border-radius: var(--r); padding: 28px 24px; display: grid; gap: 14px; border-top: 4px solid var(--orange); }
.auth-logo { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.auth-logo .logo { height: 28px; width: auto; }
.auth-logo span { font: 400 22px/1 var(--f-display); padding-left: 12px; border-left: 1px solid var(--line); }
.auth-card h2 { font: 400 28px/1.15 var(--f-display); margin: 6px 0 0; }
.auth-card p { margin: 0; color: var(--muted); }
.auth-err { color: var(--out) !important; font-weight: 700; }

@media (max-width: 640px) {
  .top-row { gap: 10px; padding-block: 10px 8px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .brand { gap: 10px; }
  .brand .logo { height: 24px; }
  .brand-text { padding-left: 10px; }
  .brand h1 { font-size: 19px; }
  #addBtn { padding: 8px 12px; font-size: 15px; }
  .mast-btn { display: none; }
  .foot { display: flex; }
}
.foot { display: none; justify-content: center; padding-block: 0 32px; }
</style>
</head>

<script>
(() => {
  "use strict";
  const CFG = window.SRG_CONFIG || {};
  const BUCKET = "item-photos";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ICON_BOX = '<svg class="ph" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>';
  const ICON_CAM = '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  const ICON_IMG = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/></svg>';

  const REASONS = {
    in: ["Supplier delivery", "Returned from venue", "Transfer in", "Found / recount", "Other"],
    out: ["Sent to venue", "Used on site", "Damaged / written off", "Transfer out", "Returned to supplier", "Other"],
    count: ["Stocktake"],
  };
  // SRG venues, from the group "Brands" list (Oct 2026). Edit here to add or rename a venue.
  const VENUES_OPEN = ["Akti", "Budgewoi Hotel", "HarbourWatch", "Lago Cucina", "Noi", "Ripples Chowder Bay", "Ripples Little Manly",
    "Ripples Rose Bay", "Riva Rose Bay", "Sails Lavender Bay", "SRG at The Australian National Maritime Museum", "SRG at The Langham",
    "SRG Events", "Summer Salt", "The Fenwick", "The James", "The Nielsen", "Ventuno"];
  const VENUES_SOON = ["Aqua", "Dunbar House", "Ripples Milsons Point", "Ripples Watsons Bay"];
  const VENUE_OTHER = "Other (see note)";
  const UNITS = ["each", "box", "carton", "case", "pack", "pallet", "roll", "kg", "L"];

  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  };
  const venueOptions = (sel, blank) =>
    (blank ? `<option value="">${blank}</option>` : `<option value="" disabled ${sel ? "" : "selected"}>Choose a venue…</option>`)
    + `<optgroup label="Venues">${VENUES_OPEN.map((v) => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("")}</optgroup>`
    + `<optgroup label="Opening soon">${VENUES_SOON.map((v) => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("")}</optgroup>`
    + `<option ${sel === VENUE_OTHER ? "selected" : ""}>${VENUE_OTHER}</option>`;

  const S = {
    items: new Map(), moves: [], itemMoves: [], itemMovesFor: null,
    q: "", cat: "", loc: "", only: "", sort: store.get("srg-sort") || "name", tab: "stock", act: "all", venue: "",
    open: null, moveType: "out", confirmDelete: false, fresh: [],
    uid: null, name: "", email: "", loaded: false, netErr: false, busy: false, pending: [],
  };
  let sb = null, channel = null, pollT = null;

  // ---------- helpers ----------
  const mapItem = (r) => ({ id: r.id, name: r.name, sku: r.sku, category: r.category, location: r.location, unit: r.unit,
    qty: Number(r.qty) || 0, minQty: Number(r.min_qty) || 0, supplier: r.supplier, notes: r.notes, photos: r.photos || [], updatedAt: r.updated_at });
  const mapMove = (r) => ({ id: r.id, itemId: r.item_id, itemName: r.item_name, sku: r.sku, unit: r.unit, type: r.type,
    qty: Number(r.qty), delta: Number(r.delta), balance: Number(r.balance), venue: r.venue, reason: r.reason, ref: r.ref,
    note: r.note, by: r.by_user, byName: r.by_name, at: r.created_at });
  const itemsArr = () => [...S.items.values()];
  const stockState = (it) => (it.qty <= 0 ? "none" : it.minQty > 0 && it.qty <= it.minQty ? "low" : "ok");
  const pill = (it) => ({ none: '<span class="pill none">Out of stock</span>', low: '<span class="pill low">Low</span>' }[stockState(it)] || "");
  const fmtQty = (n) => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("en-AU");
  const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + fmtQty(Math.abs(n));
  const dayKey = (iso) => new Date(iso).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const timeOf = (iso) => new Date(iso).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" });
  const isToday = (iso) => new Date(iso).toDateString() === new Date().toDateString();
  const who = (m) => (m.by && m.by === S.uid ? "You" : m.byName || "Someone");

  let toastT;
  function toast(msg, err) {
    const t = $("#toast");
    t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), err ? 6000 : 2800);
  }
  function errMsg(e) {
    const m = (e && (e.message || e.error_description)) || "";
    if (e && e.code === "P0001") return m;
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return "No connection. Check your Wi-Fi or mobile data and try again.";
    if (/JWT|session|not authenticated/i.test(m)) return "Your sign-in has expired. Sign in again.";
    if (e && (e.code === "42501" || /permission|row-level security/i.test(m))) return "You don't have permission to do that.";
    if (/maximum allowed size|too large|413/i.test(m)) return "That photo is too large (10 MB max).";
    if (/mime|invalid_mime/i.test(m)) return "That file type isn't supported. Use a JPG, PNG or WebP photo.";
    return m ? "Couldn't save: " + m : "Couldn't save. Try again.";
  }
  const fail = (e) => { toast(errMsg(e), true); };
  const must = ({ data, error }) => { if (error) throw error; return data; };

  // ---------- photos (private bucket → short-lived signed links) ----------
  const urls = new Map(); const wanted = new Set(); let urlT;
  function photoSrc(path) {
    const u = urls.get(path);
    if (u && u.exp > Date.now()) return u.url;
    if (!wanted.has(path)) { wanted.add(path); clearTimeout(urlT); urlT = setTimeout(fetchUrls, 20); }
    return "";
  }
  async function fetchUrls() {
    const paths = [...wanted]; wanted.clear();
    if (!paths.length) return;
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths, 6 * 3600);
    paths.forEach((p, i) => {
      const d = !error && data && data[i];
      urls.set(p, d && d.signedUrl ? { url: d.signedUrl, exp: Date.now() + 6 * 3600e3 - 120e3 } : { url: "", exp: Date.now() + 60e3 });
    });
    renderLists(true);
  }
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return (await new Promise((r) => c.toBlob(r, "image/jpeg", 0.82))) || file;
    } catch (_) { return file; }
  }
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  async function uploadPhoto(itemId, file) {
    const blob = await shrink(file);
    const type = ["image/jpeg", "image/png", "image/webp", "image/gif"].includes(blob.type) ? blob.type : "image/jpeg";
    const path = `${itemId}/${uuid()}.${type.split("/")[1].replace("jpeg", "jpg")}`;
    must(await sb.storage.from(BUCKET).upload(path, blob, { contentType: type, upsert: false }));
    return path;
  }

  // ---------- data ----------
  async function loadItems() {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const rows = must(await sb.from("items").select("*").order("name").range(from, from + 999));
      all.push(...rows);
      if (rows.length < 1000) break;
    }
    S.items = new Map(all.map((r) => [r.id, mapItem(r)]));
  }
  async function loadMoves() {
    S.moves = must(await sb.from("moves").select("*").order("created_at", { ascending: false }).limit(300)).map(mapMove);
  }
  async function loadItemMoves(id) {
    const rows = must(await sb.from("moves").select("*").eq("item_id", id).order("created_at", { ascending: false }).limit(100));
    if (S.open?.id === id) { S.itemMoves = rows.map(mapMove); S.itemMovesFor = id; }
  }
  const sig = () => JSON.stringify([S.loaded, S.netErr, [...S.items.values()], S.moves.map((m) => m.id), S.itemMovesFor, S.itemMoves.map((m) => m.id)]);
  let refreshing = null, again = false;
  async function refresh() {
    if (!sb || !S.uid) return;
    if (refreshing) { again = true; return refreshing; }
    refreshing = (async () => {
      const before = sig();
      try {
        await Promise.all([loadItems(), loadMoves(), S.open?.kind === "item" ? loadItemMoves(S.open.id) : null]);
        S.loaded = true; S.netErr = false;
      } catch (e) {
        S.netErr = true;
        if (/JWT/i.test(e?.message || "")) { await sb.auth.signOut(); }
      }
      if (sig() !== before || S.overlayStale) render(true);
    })();
    await refreshing; refreshing = null;
    if (again) { again = false; refresh(); }
  }
  let rT; const soon = () => { clearTimeout(rT); rT = setTimeout(refresh, 300); };

  // ---------- render ----------
  function filtered() {
    const q = S.q.trim().toLowerCase();
    const list = itemsArr().filter((it) => {
      if (S.cat && it.category !== S.cat) return false;
      if (S.loc && it.location !== S.loc) return false;
      if (S.only === "low" && stockState(it) === "ok") return false;
      if (S.only === "none" && stockState(it) !== "none") return false;
      if (q) {
        const hay = [it.name, it.sku, it.location, it.category, it.supplier, it.notes].join(" ").toLowerCase();
        if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
      }
      return true;
    });
    const by = {
      name: (a, b) => a.name.localeCompare(b.name),
      bin: (a, b) => (a.location || "~").localeCompare(b.location || "~", undefined, { numeric: true }) || a.name.localeCompare(b.name),
      qty: (a, b) => a.qty - b.qty,
      recent: (a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""),
    }[S.sort] || ((a, b) => a.name.localeCompare(b.name));
    return list.sort(by);
  }

  function renderSummary() {
    const arr = itemsArr();
    const low = arr.filter((i) => stockState(i) === "low").length;
    const none = arr.filter((i) => stockState(i) === "none").length;
    const today = S.moves.filter((m) => isToday(m.at)).length;
    const v = (n) => (S.loaded ? n : "–");
    $("#summary").innerHTML = `
      <div class="stat"><b>${v(arr.length)}</b><span>Stock lines</span></div>
      <button class="stat ${low ? "alert" : ""}" type="button" data-only="low"><b>${v(low)}</b><span>Low stock</span></button>
      <button class="stat ${none ? "crit" : ""}" type="button" data-only="none"><b>${v(none)}</b><span>Out of stock</span></button>
      <button class="stat" type="button" data-goto="activity"><b>${v(today)}</b><span>Moves today</span></button>`;
  }

  function renderFilters() {
    const arr = itemsArr();
    const cats = [...new Set(arr.map((i) => i.category).filter(Boolean))].sort();
    const locs = [...new Set(arr.map((i) => i.location).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    if (S.cat && !cats.includes(S.cat)) S.cat = "";
    if (S.loc && !locs.includes(S.loc)) S.loc = "";
    $("#filters").innerHTML = `
      <button class="chip" type="button" data-cat="" aria-pressed="${!S.cat}">All</button>
      ${cats.map((c) => `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join("")}
      ${S.only ? `<button class="chip" type="button" data-only="" aria-pressed="true">${S.only === "low" ? "Low stock" : "Out of stock"} ✕</button>` : ""}
      <span class="spacer"></span>
      ${locs.length ? `<select id="locSel" aria-label="Filter by bin location"><option value="">All locations</option>${locs.map((l) => `<option value="${esc(l)}" ${S.loc === l ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>` : ""}
      <select id="sortSel" aria-label="Sort">
        <option value="name" ${S.sort === "name" ? "selected" : ""}>Name A–Z</option>
        <option value="bin" ${S.sort === "bin" ? "selected" : ""}>Bin location</option>
        <option value="qty" ${S.sort === "qty" ? "selected" : ""}>Lowest qty first</option>
        <option value="recent" ${S.sort === "recent" ? "selected" : ""}>Recently changed</option>
      </select>
      ${arr.length ? `<button class="btn ghost" type="button" id="exportStock">Export CSV</button>` : ""}
      <span class="count num">${filtered().length} of ${arr.length}</span>`;
  }

  function renderGrid() {
    const el = $("#grid");
    if (!S.loaded) {
      el.innerHTML = `<div class="empty"><h2>${S.netErr ? "Can't reach the stock list" : "Loading stock…"}</h2><p>${S.netErr ? "Check your Wi-Fi or mobile data. The list will load as soon as you're back online." : "Fetching the shared stock list."}</p></div>`;
      return;
    }
    if (!S.items.size) {
      el.innerHTML = `<div class="empty">${ICON_BOX.replace('class="ph"', 'class="ph" style="width:64px;height:64px"')}
        <h2>No stock yet</h2>
        <p>Add your first item: snap a photo, give it a name and the bin it lives in (for example <span class="bin">A-03-2</span> for aisle A, bay 3, shelf 2), and enter how many are on hand.</p>
        <button class="btn primary" type="button" data-add>Add first item</button></div>`;
      return;
    }
    const list = filtered();
    if (!list.length) { el.innerHTML = `<div class="empty"><h2>No matches</h2><p>Nothing matches those filters. Clear the search or pick “All”.</p></div>`; return; }
    el.innerHTML = `<div class="grid">${list.map((it) => {
      const src = it.photos[0] ? photoSrc(it.photos[0]) : "";
      return `<button class="card" type="button" data-item="${esc(it.id)}">
        <div class="thumb">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : ICON_BOX}
          ${it.photos.length > 1 ? `<span class="count-badge">${it.photos.length} photos</span>` : ""}</div>
        <div class="card-body">
          <div class="card-name">${esc(it.name)}</div>
          <div class="card-meta">${it.location ? `<span class="bin">${esc(it.location)}</span>` : ""}${it.sku ? `<span class="mono">${esc(it.sku)}</span>` : ""}</div>
          <div class="card-foot"><span class="qty">${fmtQty(it.qty)}<small>${esc(it.unit || "each")}</small></span>${pill(it)}</div>
        </div></button>`;
    }).join("")}</div>`;
  }

  function moveRows(moves, showItem) {
    let out = "", lastDay = "";
    for (const m of moves) {
      const d = dayKey(m.at);
      if (d !== lastDay) { out += `<div class="day">${isToday(m.at) ? "Today" : esc(d)}</div>`; lastDay = d; }
      const cls = m.type === "in" ? "d-in" : m.type === "out" ? "d-out" : "d-count";
      const label = m.type === "in" ? "Booked in" : m.type === "out" ? "Booked out" : "Stocktake";
      const exists = m.itemId && S.items.has(m.itemId);
      const title = showItem
        ? (exists ? `<button class="linkish" type="button" data-item="${esc(m.itemId)}">${esc(m.itemName)}</button>` : esc(m.itemName) + ' <span class="status">(deleted)</span>')
        : label;
      const detail = [showItem ? label : "", m.venue ? (m.type === "in" ? "from " : "to ") + m.venue : "", m.reason, m.ref ? "Ref " + m.ref : "", m.note, who(m)]
        .filter(Boolean).map(esc).join(" · ");
      out += `<div class="log-row">
        <div class="log-when">${timeOf(m.at)}</div>
        <div class="log-what"><div class="t">${title}</div><div class="d">${detail}</div></div>
        <div class="log-delta ${cls}">${m.type === "count" ? "= " + fmtQty(m.balance) : signed(m.delta)}<small>${m.type === "count" ? "was " + fmtQty(m.balance - m.delta) : "bal " + fmtQty(m.balance)} ${esc(m.unit || "")}</small></div>
      </div>`;
    }
    return out;
  }

  const actList = () => S.moves.filter((m) => (S.act === "all" || m.type === S.act) && (!S.venue || m.venue === S.venue));
  function renderActivity() {
    const used = [...new Set(S.moves.map((m) => m.venue).filter(Boolean))].sort();
    if (S.venue && !used.includes(S.venue)) S.venue = "";
    const opts = [["all", "All"], ["in", "Booked in"], ["out", "Booked out"], ["count", "Stocktakes"]];
    $("#actFilters").innerHTML = opts.map(([k, l]) => `<button class="chip" type="button" data-act="${k}" aria-pressed="${S.act === k}">${l}</button>`).join("")
      + `<span class="spacer"></span>`
      + (used.length ? `<select id="actVenue" aria-label="Filter by venue"><option value="">All venues</option>${used.map((v) => `<option ${S.venue === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>` : "")
      + (S.moves.length ? `<button class="btn ghost" type="button" id="exportMoves">Export CSV</button>` : "")
      + `<span class="count">Latest ${S.moves.length} moves</span>`;
    const list = actList();
    $("#log").innerHTML = !S.loaded
      ? `<div class="empty"><h2>Loading…</h2></div>`
      : list.length ? `<div class="log">${moveRows(list, true)}</div>`
      : `<div class="empty"><h2>No movements yet</h2><p>Every time stock is booked in, booked out or counted, it’s logged here with who did it, when, and which venue it went to.</p></div>`;
  }

  function renderItemSheet(it) {
    const reasons = REASONS[S.moveType];
    const hist = S.itemMovesFor === it.id ? S.itemMoves : null;
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head gutter"><h2 id="sheetTitle">${esc(it.name)}</h2>
        <button class="btn ghost" type="button" data-close aria-label="Close">✕</button></div>
      <div class="sheet-body gutter">
        <div class="section"><h3>Photos</h3>
          <div class="photos">
            ${it.photos.map((p) => { const src = photoSrc(p); return `<div class="photo"><button type="button" class="zoom" data-zoom="${esc(p)}">${src ? `<img src="${esc(src)}" alt="Photo of ${esc(it.name)}" loading="lazy">` : ""}</button>
              <button class="x" type="button" data-rmphoto="${esc(p)}" aria-label="Remove photo">×</button></div>`; }).join("")}
            <button class="add-photo" type="button" data-cam="item">${ICON_CAM}Take photo</button>
            <button class="add-photo" type="button" data-pick="item">${ICON_IMG}Choose from library</button>
          </div>
          ${S.busy === "photo" ? `<p class="status">Uploading…</p>` : ""}
        </div>

        <div class="facts">
          <div class="fact big"><span>On hand</span><b>${fmtQty(it.qty)}</b> <span style="display:inline">${esc(it.unit || "each")}</span> ${pill(it)}</div>
          <div class="fact"><span>Bin location</span><b>${it.location ? `<span class="bin" style="font-size:15px">${esc(it.location)}</span>` : "Not set"}</b>
            <span style="margin-top:8px">Reorder at</span><b class="num">${it.minQty ? fmtQty(it.minQty) + " " + esc(it.unit || "") : "Not set"}</b></div>
          <div class="fact"><span>SKU / code</span><b class="mono">${esc(it.sku) || "—"}</b></div>
          <div class="fact"><span>Category</span><b>${esc(it.category) || "—"}</b></div>
          ${it.supplier ? `<div class="fact" style="grid-column:1/-1"><span>Supplier</span><b>${esc(it.supplier)}</b></div>` : ""}
        </div>
        ${it.notes ? `<div class="notes">${esc(it.notes)}</div>` : ""}

        <form class="move" id="moveForm" autocomplete="off">
          <div class="seg" role="group" aria-label="Movement type">
            <button type="button" data-t="in" aria-pressed="${S.moveType === "in"}">Book in</button>
            <button type="button" data-t="out" aria-pressed="${S.moveType === "out"}">Book out</button>
            <button type="button" data-t="count" aria-pressed="${S.moveType === "count"}">Count</button>
          </div>
          <label class="f" for="mvQty">${S.moveType === "count" ? "Counted on the shelf" : "Quantity"} (${esc(it.unit || "each")})
            <div class="stepper"><button type="button" data-step="-1" aria-label="Less">−</button>
            <input id="mvQty" type="number" inputmode="decimal" min="0" step="any" value="${S.moveType === "count" ? String(it.qty) : 1}" required>
            <button type="button" data-step="1" aria-label="More">+</button></div></label>
          ${S.moveType === "out" ? `<label class="f" for="mvVenue">Venue <span class="req">*</span><select id="mvVenue" required>${venueOptions(store.get("srg-venue"))}</select></label>`
            : S.moveType === "in" ? `<label class="f" for="mvVenue">From venue<select id="mvVenue">${venueOptions("", "Not from a venue")}</select></label>` : ""}
          <div class="row2">
            <label class="f" for="mvReason">Reason<select id="mvReason">${reasons.map((r) => `<option>${esc(r)}</option>`).join("")}</select></label>
            <label class="f" for="mvRef">${S.moveType === "out" ? "Docket no." : S.moveType === "in" ? "PO / invoice no." : "Reference"}
              <input id="mvRef" type="text" maxlength="100" placeholder="optional"></label>
          </div>
          <label class="f" for="mvNote">Note<input id="mvNote" type="text" maxlength="500" placeholder="optional"></label>
          <div class="preview" id="mvPreview"></div>
          <button class="btn primary" type="submit" ${S.busy ? "disabled" : ""}>${S.busy === "move" ? "Saving…" : S.moveType === "in" ? "Book in" : S.moveType === "out" ? "Book out" : "Save count"}</button>
        </form>

        <div class="section"><h3>History</h3>
          ${hist ? (hist.length ? `<div class="hist">${moveRows(hist, false)}</div>` : `<p class="status">No movements recorded yet.</p>`) : `<p class="status">Loading history…</p>`}
        </div>

        <div class="section"><h3>Item</h3>
          ${S.confirmDelete ? `<div class="confirm"><b>Delete “${esc(it.name)}”?</b><span>It disappears from the stock list and its photos are deleted. Its past movements stay in Ins &amp; outs.</span>
            <div class="foot-actions"><button class="btn danger" type="button" data-delete-yes>Delete item</button><button class="btn" type="button" data-delete-no>Keep it</button></div></div>`
          : `<div class="foot-actions"><button class="btn" type="button" data-edit="${esc(it.id)}">Edit details</button><button class="btn danger" type="button" data-delete>Delete…</button></div>`}
        </div>
      </div></div>`;
  }

  function renderForm(it) {
    const editing = !!it;
    const v = it || { unit: "each" };
    const arr = itemsArr();
    const dl = (key) => [...new Set(arr.map((i) => i[key]).filter(Boolean))].sort().map((c) => `<option value="${esc(c)}">`).join("");
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="sheet-head gutter"><h2 id="formTitle">${editing ? "Edit item" : "Add stock item"}</h2>
        <button class="btn ghost" type="button" data-close aria-label="Close">✕</button></div>
      <form class="sheet-body gutter" id="itemForm" autocomplete="off">
        ${!editing ? `<div class="section"><h3>Photos</h3>
          <div class="photos">
            ${S.pending.map((p, i) => `<div class="photo" style="width:120px"><img src="${p.url}" alt=""><button class="x" type="button" data-rmpending="${i}" aria-label="Remove photo">×</button></div>`).join("")}
            <button class="add-photo" type="button" data-cam="form" style="width:120px">${ICON_CAM}Take photo</button>
            <button class="add-photo" type="button" data-pick="form" style="width:120px">${ICON_IMG}Choose</button>
          </div></div>` : ""}
        <label class="f" for="fName">Item name <span class="req">*</span><input id="fName" required maxlength="140" value="${esc(v.name)}" placeholder="e.g. Riedel Pinot glass 700ml"></label>
        <div class="row2">
          <label class="f" for="fSku">SKU / code<input id="fSku" class="mono" maxlength="60" value="${esc(v.sku)}" placeholder="optional"></label>
          <label class="f" for="fCat">Category<input id="fCat" list="dlCat" maxlength="60" value="${esc(v.category)}" placeholder="e.g. Glassware"></label>
        </div>
        <div class="row2">
          <label class="f" for="fLoc">Bin location<input id="fLoc" list="dlLoc" class="mono" maxlength="40" value="${esc(v.location)}" placeholder="e.g. A-03-2"></label>
          <label class="f" for="fUnit">Unit<input id="fUnit" list="dlUnit" maxlength="20" value="${esc(v.unit || "each")}"></label>
        </div>
        <div class="row2">
          ${!editing ? `<label class="f" for="fQty">Quantity on hand now<input id="fQty" type="number" inputmode="decimal" min="0" step="any" value="0"></label>` : ""}
          <label class="f" for="fMin">Reorder at (low-stock level)<input id="fMin" type="number" inputmode="decimal" min="0" step="any" value="${editing && v.minQty ? esc(v.minQty) : ""}" placeholder="optional"></label>
        </div>
        <label class="f" for="fSup">Supplier<input id="fSup" list="dlSup" maxlength="100" value="${esc(v.supplier)}" placeholder="optional"></label>
        <label class="f" for="fNotes">Notes<textarea id="fNotes" maxlength="2000" placeholder="Pack size, condition, which venues use it…">${esc(v.notes)}</textarea></label>
        <datalist id="dlCat">${dl("category")}</datalist>
        <datalist id="dlLoc">${dl("location")}</datalist>
        <datalist id="dlUnit">${UNITS.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
        <datalist id="dlSup">${dl("supplier")}</datalist>
        <div class="foot-actions">
          <button class="btn primary" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Saving…" : editing ? "Save changes" : "Add to stock"}</button>
          <button class="btn" type="button" data-close>Cancel</button>
        </div>
      </form></div>`;
  }

  function renderOverlay(bg) {
    const ov = $("#overlay");
    if (!S.open) { ov.hidden = true; ov.innerHTML = ""; return; }
    let html;
    if (S.open.kind === "item") {
      const it = S.items.get(S.open.id);
      if (!it) { S.open = null; ov.hidden = true; ov.innerHTML = ""; return; }
      html = renderItemSheet(it);
    } else html = renderForm(S.open.id ? S.items.get(S.open.id) : null);
    const opening = ov.hidden || !ov.firstElementChild;
    // A background update must not rebuild the panel while someone is typing or has a picker open.
    const ae = document.activeElement;
    if (bg && !opening && ae && ov.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) { S.overlayStale = true; return; }
    S.overlayStale = false;
    const keep = {};
    ov.querySelectorAll("input[id],select[id],textarea[id]").forEach((el) => { if (el.type !== "file") keep[el.id] = el.value; });
    const scroll = ov.querySelector(".sheet")?.scrollTop || 0;
    const focusId = document.activeElement && ov.contains(document.activeElement) ? document.activeElement.id : null;
    ov.innerHTML = html; ov.hidden = false;
    for (const [id, val] of Object.entries(keep)) { const el = document.getElementById(id); if (el && !S.fresh.includes(id)) el.value = val; }
    S.fresh = [];
    const sh = ov.querySelector(".sheet");
    if (sh) { sh.scrollTop = scroll; if (opening) sh.classList.add("enter"); }
    if (focusId) document.getElementById(focusId)?.focus();
    updatePreview();
  }

  function updatePreview() {
    const p = $("#mvPreview"); if (!p || S.open?.kind !== "item") return;
    const it = S.items.get(S.open.id); if (!it) return;
    const n = parseFloat($("#mvQty").value);
    if (!(n >= 0)) { p.textContent = "Enter a quantity."; return; }
    const u = esc(it.unit || "");
    const after = S.moveType === "in" ? it.qty + n : S.moveType === "out" ? it.qty - n : n;
    p.innerHTML = after < 0 && S.moveType === "out"
      ? `<span style="color:var(--out)">Only ${fmtQty(it.qty)} ${u} on hand.</span>`
      : `On hand goes from <b>${fmtQty(it.qty)}</b> to <b>${fmtQty(after)}</b> ${u}${S.moveType === "count" ? ` (${signed(after - it.qty)})` : ""}.`;
  }

  function renderLists(bg) {
    if (!S.uid) return;
    renderSummary();
    if (S.tab === "stock") { renderFilters(); renderGrid(); } else renderActivity();
    renderOverlay(bg);
  }
  function render(bg) {
    for (const t of ["stock", "activity"]) {
      $("#tab-" + t).setAttribute("aria-selected", String(S.tab === t));
      $("#view-" + t).hidden = S.tab !== t;
    }
    $("#status").textContent = S.netErr ? "Offline · showing last loaded stock" : S.loaded ? `Signed in as ${S.name}` : "Loading…";
    $("#notice").hidden = !(S.netErr && S.loaded);
    $("#notice").textContent = "You're offline. Changes can't be saved until you're back online.";
    renderLists(bg);
  }

  // ---------- sign in ----------
  const LOGO = document.querySelector("#logoTpl").innerHTML;
  function showAuth(mode, msg) {
    $("#app").hidden = true;
    const a = $("#auth"); a.hidden = false;
    const head = `<div class="auth-logo">${LOGO}<span>Warehouse</span></div>`;
    if (mode === "setup") {
      a.innerHTML = `<div class="auth-card">${head}<h2>Almost ready</h2>
        <p>This copy of the app isn't connected to a database yet. Add your Supabase project URL and anon key to <code>config.js</code>, then reload. The README in the GitHub repo has step-by-step instructions.</p></div>`;
    } else if (mode === "name") {
      a.innerHTML = `<form class="auth-card" id="nameForm">${head}<h2>What's your name?</h2>
        <p>It's shown in the stock log next to everything you book in or out.</p>
        <label class="f" for="nmName">Your name<input id="nmName" required maxlength="80" autocomplete="name" placeholder="e.g. Sam Taylor"></label>
        <p class="auth-err" id="authErr" ${msg ? "" : "hidden"}>${esc(msg)}</p>
        <button class="btn primary" type="submit">Continue</button>
        <button class="btn ghost" type="button" data-signout>Sign out</button></form>`;
      setTimeout(() => $("#nmName")?.focus(), 30);
    } else {
      a.innerHTML = `<form class="auth-card" id="signinForm">${head}<h2>Sign in</h2>
        <p>Use the email and password your manager set up for you.</p>
        <label class="f" for="siEmail">Email<input id="siEmail" type="email" required autocomplete="username" inputmode="email" value="${esc(store.get("srg-email"))}"></label>
        <label class="f" for="siPass">Password<input id="siPass" type="password" required autocomplete="current-password"></label>
        <p class="auth-err" id="authErr" ${msg ? "" : "hidden"}>${esc(msg)}</p>
        <button class="btn primary" type="submit" id="siBtn">Sign in</button>
        <p class="status">Forgotten your password? Ask your manager to reset it.</p></form>`;
      setTimeout(() => (store.get("srg-email") ? $("#siPass") : $("#siEmail"))?.focus(), 30);
    }
  }
  async function signIn() {
    const email = $("#siEmail").value.trim(), password = $("#siPass").value;
    const btn = $("#siBtn"); btn.disabled = true; btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      const m = /invalid login|invalid credentials/i.test(error.message) ? "That email and password don't match. Check them and try again."
        : /fetch|network/i.test(error.message) ? "No connection. Check your Wi-Fi or mobile data." : error.message;
      showAuth("signin", m); $("#siEmail").value = email;
      return;
    }
    store.set("srg-email", email);
  }
  async function saveName() {
    const name = $("#nmName").value.trim(); if (!name) return;
    const { error } = await sb.from("profiles").upsert({ id: S.uid, full_name: name });
    if (error) { showAuth("name", errMsg(error)); return; }
    S.name = name; startApp();
  }

  let sessionUid;
  async function onSession(session) {
    const uid = session?.user?.id || null;
    if (uid === sessionUid && uid) return;
    sessionUid = uid;
    if (!uid) {
      S.uid = null; S.loaded = false; S.items = new Map(); S.moves = []; S.open = null;
      if (channel) { sb.removeChannel(channel); channel = null; }
      clearInterval(pollT);
      showAuth("signin");
      return;
    }
    S.uid = uid; S.email = session.user.email || "";
    const { data } = await sb.from("profiles").select("full_name").eq("id", uid).maybeSingle();
    S.name = (data && data.full_name) || "";
    if (!S.name) { showAuth("name"); return; }
    startApp();
  }
  function startApp() {
    $("#auth").hidden = true; $("#auth").innerHTML = ""; $("#app").hidden = false;
    S.loaded = false; route(); refresh();
    if (!channel) {
      channel = sb.channel("stock")
        .on("postgres_changes", { event: "*", schema: "public", table: "items" }, soon)
        .on("postgres_changes", { event: "*", schema: "public", table: "moves" }, soon)
        .subscribe();
    }
    clearInterval(pollT);
    pollT = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 60000);
  }

  // ---------- overlay control ----------
  function openItem(id) {
    S.open = { kind: "item", id }; S.confirmDelete = false; S.moveType = "out";
    S.itemMoves = []; S.itemMovesFor = null; S.fresh = ["mvQty", "mvVenue", "mvReason", "mvRef", "mvNote"];
    render();
    loadItemMoves(id).then(() => renderOverlay(true)).catch(() => {});
  }
  function openForm(id) {
    S.pending.forEach((p) => URL.revokeObjectURL(p.url));
    S.pending = []; S.open = { kind: "form", id: id || null };
    $("#overlay").innerHTML = "";
    render();
    setTimeout(() => $("#fName")?.focus(), 30);
  }
  function closeOverlay() {
    if (S.open?.kind === "form" && S.open.id) { openItem(S.open.id); return; }
    S.open = null; S.pending.forEach((p) => URL.revokeObjectURL(p.url)); S.pending = [];
    S.itemMovesFor = null; S.itemMoves = [];
    render();
  }

  // ---------- actions ----------
  async function saveForm() {
    const val = (id) => ($("#" + id)?.value || "").trim();
    const name = val("fName");
    if (!name) { toast("Give the item a name.", true); return; }
    const data = {
      name, sku: val("fSku"), category: val("fCat"), location: val("fLoc").toUpperCase(), unit: val("fUnit") || "each",
      min_qty: Math.max(0, parseFloat(val("fMin")) || 0), supplier: val("fSup"), notes: val("fNotes"),
    };
    S.busy = true; renderOverlay();
    try {
      if (S.open.id) {
        must(await sb.from("items").update(data).eq("id", S.open.id));
        toast("Saved");
        const id = S.open.id; S.busy = false; await refresh(); openItem(id); return;
      }
      const row = must(await sb.from("items").insert(data).select().single());
      const photos = [];
      for (const p of S.pending) { try { photos.push(await uploadPhoto(row.id, p.blob)); } catch (e) { fail(e); } }
      if (photos.length) must(await sb.from("items").update({ photos }).eq("id", row.id));
      const qty = Math.max(0, parseFloat(val("fQty")) || 0);
      if (qty > 0) must(await sb.rpc("book_stock", { p_item: row.id, p_type: "in", p_qty: qty, p_reason: "Opening stock" }));
      S.busy = false; toast(`Added ${name}`);
      S.pending.forEach((p) => URL.revokeObjectURL(p.url)); S.pending = [];
      await refresh(); openItem(row.id);
    } catch (e) { S.busy = false; fail(e); renderOverlay(); }
  }

  async function submitMove() {
    const it = S.items.get(S.open.id); if (!it) return;
    const type = S.moveType;
    const n = parseFloat($("#mvQty").value);
    if (!(n >= 0) || (type !== "count" && n === 0)) { toast("Enter a quantity above zero.", true); return; }
    const reason = $("#mvReason").value, ref = $("#mvRef").value.trim(), note = $("#mvNote").value.trim();
    const venue = type === "count" ? "" : ($("#mvVenue")?.value || "");
    if (type === "out" && !venue) { toast("Choose which venue the stock is going to.", true); $("#mvVenue")?.focus(); return; }
    if (venue === VENUE_OTHER && !note) { toast("Add where it went in the note.", true); $("#mvNote")?.focus(); return; }
    if (type === "out") store.set("srg-venue", venue);
    S.busy = "move"; renderOverlay();
    try {
      const m = must(await sb.rpc("book_stock", { p_item: it.id, p_type: type, p_qty: n, p_venue: venue, p_reason: reason, p_ref: ref, p_note: note }));
      toast(type === "count" ? `Count saved: ${fmtQty(m.balance)} ${it.unit}` : `${type === "in" ? "Booked in" : "Booked out"} ${fmtQty(n)}${type === "out" ? " to " + venue : ""} · now ${fmtQty(m.balance)} on hand`);
      S.fresh = ["mvQty", "mvRef", "mvNote"];
      S.busy = false;
      await refresh(); renderOverlay();
    } catch (e) { S.busy = false; fail(e); renderOverlay(); }
  }

  async function addPhotosToItem(files) {
    const id = S.open?.id; if (!id || !files.length) return;
    S.busy = "photo"; renderOverlay();
    const paths = [];
    for (const f of files) { try { paths.push(await uploadPhoto(id, f)); } catch (e) { fail(e); } }
    try {
      if (paths.length) {
        const cur = must(await sb.from("items").select("photos").eq("id", id).single());
        must(await sb.from("items").update({ photos: [...(cur.photos || []), ...paths] }).eq("id", id));
        toast(paths.length > 1 ? `${paths.length} photos added` : "Photo added");
      }
    } catch (e) { fail(e); }
    S.busy = false; await refresh(); renderOverlay();
  }

  async function removePhoto(path) {
    const id = S.open?.id; if (!id) return;
    try {
      const cur = must(await sb.from("items").select("photos").eq("id", id).single());
      must(await sb.from("items").update({ photos: (cur.photos || []).filter((p) => p !== path) }).eq("id", id));
      sb.storage.from(BUCKET).remove([path]);
      toast("Photo removed");
      await refresh();
    } catch (e) { fail(e); }
  }

  async function deleteItem() {
    const id = S.open?.id; const it = S.items.get(id); if (!it) return;
    try {
      must(await sb.from("items").delete().eq("id", id));
      if (it.photos.length) sb.storage.from(BUCKET).remove(it.photos);
      toast(`Deleted ${it.name}`);
      S.open = null; await refresh();
    } catch (e) { fail(e); }
  }

  const csvCell = (v) => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  function exportCsv(kind) {
    const stamp = new Date().toISOString().slice(0, 10);
    let rows, name;
    if (kind === "stock") {
      rows = [["Name", "SKU", "Category", "Bin location", "On hand", "Unit", "Reorder at", "Status", "Supplier", "Notes", "Last changed"]]
        .concat(filtered().map((i) => [i.name, i.sku, i.category, i.location, i.qty, i.unit, i.minQty || "", { ok: "OK", low: "Low", none: "Out" }[stockState(i)], i.supplier, i.notes,
          i.updatedAt ? new Date(i.updatedAt).toLocaleString("en-AU") : ""]));
      name = `srg-stock-${stamp}.csv`;
    } else {
      rows = [["Date", "Time", "Item", "SKU", "Type", "Change", "Balance", "Unit", "Venue", "Reason", "Reference", "Note", "By"]]
        .concat(actList().map((m) => [new Date(m.at).toLocaleDateString("en-AU"), timeOf(m.at), m.itemName, m.sku,
          { in: "In", out: "Out", count: "Stocktake" }[m.type], m.delta, m.balance, m.unit, m.venue, m.reason, m.ref, m.note, m.byName]));
      name = `srg-stock-movements-${stamp}.csv`;
    }
    const blob = new Blob(["﻿" + rows.map((r) => r.map(csvCell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ---------- events ----------
  let camTarget = "item";
  function handleFiles(files) {
    files = [...files].filter((f) => f.type.startsWith("image/") || !f.type);
    if (!files.length) return;
    if (camTarget === "form") {
      for (const f of files) S.pending.push({ blob: f, url: URL.createObjectURL(f) });
      renderOverlay();
    } else addPhotosToItem(files);
  }
  $("#camInput").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
  $("#fileInput").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });

  document.addEventListener("click", (e) => {
    if (e.target.id === "overlay") { closeOverlay(); return; }
    if (e.target.closest("#lightbox")) { $("#lightbox").hidden = true; return; }
    const t = e.target.closest("button");
    if (!t) return;
    const d = t.dataset;
    if ("signout" in d) { sb.auth.signOut(); return; }
    if (t.id === "addBtn" || "add" in d) return openForm(null);
    if (d.tab) { location.hash = d.tab; return; }
    if (d.goto) { location.hash = d.goto; return; }
    if ("only" in d) { S.only = S.only === d.only ? "" : d.only; if (S.tab !== "stock") location.hash = "stock"; render(); return; }
    if ("cat" in d) { S.cat = d.cat; render(); return; }
    if (d.act) { S.act = d.act; render(); return; }
    if (d.item) return openItem(d.item);
    if ("close" in d) return closeOverlay();
    if (d.t) { S.moveType = d.t; S.fresh = ["mvReason", "mvQty", "mvVenue"]; renderOverlay(); return; }
    if (d.step) { const q = $("#mvQty"); q.value = Math.max(0, (parseFloat(q.value) || 0) + Number(d.step)); updatePreview(); return; }
    if (d.cam) { camTarget = d.cam; $("#camInput").click(); return; }
    if (d.pick) { camTarget = d.pick; $("#fileInput").click(); return; }
    if (d.zoom) { const src = photoSrc(d.zoom); if (src) { $("#lbImg").src = src; $("#lightbox").hidden = false; } return; }
    if (d.rmphoto) return removePhoto(d.rmphoto);
    if (d.rmpending) { const [p] = S.pending.splice(Number(d.rmpending), 1); if (p) URL.revokeObjectURL(p.url); renderOverlay(); return; }
    if (d.edit) return openForm(d.edit);
    if ("delete" in d) { S.confirmDelete = true; renderOverlay(); return; }
    if ("deleteNo" in d) { S.confirmDelete = false; renderOverlay(); return; }
    if ("deleteYes" in d) return deleteItem();
    if (t.id === "exportStock") return exportCsv("stock");
    if (t.id === "exportMoves") return exportCsv("moves");
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "signinForm") return signIn();
    if (e.target.id === "nameForm") return saveName();
    if (S.busy) return;
    if (e.target.id === "itemForm") saveForm();
    if (e.target.id === "moveForm") submitMove();
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "q") { S.q = e.target.value; if (S.tab !== "stock") location.hash = "stock"; else { renderFilters(); renderGrid(); } }
    if (e.target.id === "mvQty") updatePreview();
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "locSel") { S.loc = e.target.value; render(); }
    if (e.target.id === "sortSel") { S.sort = e.target.value; store.set("srg-sort", S.sort); render(); }
    if (e.target.id === "actVenue") { S.venue = e.target.value; renderActivity(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#lightbox").hidden) { $("#lightbox").hidden = true; return; }
    if (S.open) closeOverlay();
  });
  document.addEventListener("focusout", () => setTimeout(() => {
    const ae = document.activeElement;
    if (S.overlayStale && !(ae && $("#overlay").contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) renderOverlay(true);
  }, 400));
  document.addEventListener("dragover", (e) => { if (S.open) e.preventDefault(); });
  document.addEventListener("drop", (e) => {
    if (!S.open || !e.dataTransfer?.files?.length) return;
    e.preventDefault(); camTarget = S.open.kind === "form" ? "form" : "item"; handleFiles(e.dataTransfer.files);
  });
  document.addEventListener("error", (e) => { if (e.target && e.target.tagName === "IMG") e.target.style.visibility = "hidden"; }, true);
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") hiddenAt = Date.now();
    else if (Date.now() - hiddenAt > 30000) refresh();
  });
  window.addEventListener("online", refresh);

  function route() {
    S.tab = location.hash === "#activity" ? "activity" : "stock";
    if (S.uid) render();
  }
  window.addEventListener("hashchange", route);

  // ---------- boot ----------
  if (!CFG.supabaseUrl || /YOUR-/.test(CFG.supabaseUrl) || !CFG.supabaseAnonKey || !window.supabase) { showAuth("setup"); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  // Supabase recommends not awaiting its own calls inside this callback, so hand off with setTimeout.
  sb.auth.onAuthStateChange((_ev, session) => setTimeout(() => onSession(session), 0));
})();
</script>
</body>
</html>
